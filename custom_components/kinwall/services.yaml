import_recipe:
  fields:
    config_entry:
      selector:
        config_entry:
          integration: kinwall
    source:
      default: hellofresh
      example: hellofresh
      selector:
        text:
    external_id:
      required: true
      example: 6819dfd55efe69a088447ef3
      selector:
        text:
    name:
      required: true
      example: Creamy Chicken
      selector:
        text:
    description:
      selector:
        text:
          multiline: true
    source_url:
      selector:
        text:
          type: url
    image_url:
      selector:
        text:
          type: url
    servings:
      example: 2
      selector:
        number:
          min: 1
          max: 100
          mode: box
    prep_minutes:
      example: 10
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    total_minutes:
      example: 35
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    ingredients:
      example: '["Salt", {"text": "1.5 tablespoon Sour Cream", "pantry": false}]'
      selector:
        object:
    steps:
      example: '["Boil water.", {"text": "Cook the chicken", "bullets": ["Pat dry.", "Sear 5 minutes a side."], "image_url": "https://example.com/step2.jpg", "title": "Sear the chicken", "timers": [{"name": "Chicken", "minutes": 10}]}]'
      selector:
        object:
    plan_date:
      selector:
        date:
    plan_slot:
      default: dinner
      selector:
        select:
          options: [breakfast, lunch, dinner, snack]
          translation_key: slot
    plan_servings:
      selector:
        number:
          min: 1
          max: 100
          mode: box
    plan_calendar_id:
      example: 3f2c9a3e-8a4b-4c1d-9e2f-5b6a7c8d9e0f
      selector:
        text:

sync_events:
  fields:
    config_entry:
      selector:
        config_entry:
          integration: kinwall
    calendar_id:
      required: true
      example: 3f2c9a3e-8a4b-4c1d-9e2f-5b6a7c8d9e0f
      selector:
        text:
    source:
      default: home_assistant
      example: ha:hellofresh
      selector:
        text:
    from:
      selector:
        date:
    to:
      selector:
        date:
    events:
      example: '[{"external_id": "delivery-2026-W41", "title": "HelloFresh delivery", "start": "2026-10-07T08:00:00", "end": "2026-10-07T20:00:00", "notes": "Tacos"}, {"external_id": "deadline-2026-W41", "title": "Pick HelloFresh meals", "start": "2026-10-02", "end": "2026-10-03", "all_day": true}]'
      selector:
        object:

plan_meal:
  fields:
    config_entry:
      selector:
        config_entry:
          integration: kinwall
    date:
      required: true
      selector:
        date:
    slot:
      default: dinner
      selector:
        select:
          options: [breakfast, lunch, dinner, snack]
          translation_key: slot
    title:
      example: Leftover soup
      selector:
        text:
    recipe_id:
      selector:
        text:
    servings:
      selector:
        number:
          min: 1
          max: 100
          mode: box
    notes:
      selector:
        text:
          multiline: true

night_screen:
  fields:
    config_entry:
      selector:
        config_entry:
          integration: kinwall
    "on":
      required: true
      default: true
      selector:
        boolean:
    displays:
      example: switch.hallway_night_screen
      selector:
        entity:
          integration: kinwall
          domain: switch
          multiple: true
    hours:
      example: 12
      selector:
        number:
          min: 0.5
          max: 168
          step: 0.5
          unit_of_measurement: h
          mode: box
