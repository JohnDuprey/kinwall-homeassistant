name: Track Kinwall releases

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-kinwall-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Test release updater
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Read latest published Kinwall release
        run: gh api repos/JohnDuprey/kinwall/releases/latest > "$RUNNER_TEMP/kinwall-release.json"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare add-on version and changelog
        id: sync
        run: python scripts/sync_release.py "$RUNNER_TEMP/kinwall-release.json"
      - name: Open update for review
        if: steps.sync.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.version }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="chore/kinwall-$VERSION"
          # A closed PR is an intentional skip; never reopen it or overwrite someone's edits.
          existing=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state all --json number --jq 'length')
          if [ "$existing" != 0 ]; then
            echo "An update PR for Kinwall $VERSION already exists; leaving it unchanged."
            exit 0
          fi
          git diff --check
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kinwall/config.yaml kinwall/CHANGELOG.md
          git commit -m "chore(release): update add-on to Kinwall $VERSION"
          # No force push: an existing branch is never overwritten.
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          Updates the Home Assistant add-on to Kinwall $VERSION and includes its published release notes.

          Both linux/amd64 and linux/arm64 images are available. Review the changelog and approve any pending validation workflows before merging. The HACS integration version is unchanged.

          Upstream release: https://github.com/JohnDuprey/kinwall/releases/tag/v$VERSION
          EOF
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "chore(release): update add-on to Kinwall $VERSION" \
            --body-file "$RUNNER_TEMP/release-pr.md"
