name: Kinwall
version: "1.0.1"
slug: kinwall
description: Self-hosted family wall calendar + chore chart
url: https://github.com/JohnDuprey/kinwall-homeassistant
arch:
  - aarch64
  - amd64
image: ghcr.io/johnduprey/kinwall
init: false
ingress: true
ingress_port: 8080
panel_icon: mdi:calendar-heart
panel_title: Family
map:
  - type: data
    read_only: false
ports:
  8080/tcp: null
ports_description:
  8080/tcp: "Optional: expose directly on the LAN (e.g. for a kiosk iPad) instead of going through ingress"
options:
  google_client_id: ""
  google_client_secret: ""
  microsoft_client_id: ""
  microsoft_client_secret: ""
  public_url: ""
  timezone: ""
schema:
  google_client_id: "str?"
  google_client_secret: "password?"
  microsoft_client_id: "str?"
  microsoft_client_secret: "password?"
  public_url: "str?"
  timezone: "str?"
